<div data-hf-id="hf-jn2k" id="root" data-composition-id="captions" data-width="1920" data-height="1080"><div data-hf-id="hf-gkvd" id="cap0" class="cap">What if an online store could</div><div data-hf-id="hf-2zz5" id="cap1" class="cap">see a loss coming,</div><div data-hf-id="hf-gcyl" id="cap2" class="cap">before it actually happens?</div><div data-hf-id="hf-dsbg" id="cap3" class="cap">Think about this.</div><div data-hf-id="hf-axfh" id="cap4" class="cap">Every day,</div><div data-hf-id="hf-g6x0" id="cap5" class="cap">thousands of orders are placed online.</div><div data-hf-id="hf-5jsb" id="cap6" class="cap">But not every order ends well.</div><div data-hf-id="hf-m95e" id="cap7" class="cap">Some customers reject the parcel at</div><div data-hf-id="hf-zqqv" id="cap8" class="cap">the door.</div><div data-hf-id="hf-a81e" id="cap9" class="cap">Some orders get cancelled again and</div><div data-hf-id="hf-eikv" id="cap10" class="cap">again.</div><div data-hf-id="hf-n7ho" id="cap11" class="cap">Some returns and refunds quietly eat</div><div data-hf-id="hf-pla2" id="cap12" class="cap">the profit.</div><div data-hf-id="hf-1eix" id="cap13" class="cap">And most businesses only find out</div><div data-hf-id="hf-4lwn" id="cap14" class="cap">after the damage is done.</div><div data-hf-id="hf-i4re" id="cap15" class="cap">So I asked a simple question.</div><div data-hf-id="hf-qb5l" id="cap16" class="cap">What if we could see the</div><div data-hf-id="hf-028h" id="cap17" class="cap">warning signs earlier?</div><div data-hf-id="hf-4uoo" id="cap18" class="cap">That is the idea behind CommerceGuard.</div><div data-hf-id="hf-ssnv" id="cap19" class="cap">A risk system for e-commerce,</div><div data-hf-id="hf-9n47" id="cap20" class="cap">built from scratch with machine learning.</div><div data-hf-id="hf-336p" id="cap21" class="cap">No ready-made AI.</div><div data-hf-id="hf-5cus" id="cap22" class="cap">No large language models.</div><div data-hf-id="hf-owcf" id="cap23" class="cap">Just real data,</div><div data-hf-id="hf-nu8p" id="cap24" class="cap">careful features,</div><div data-hf-id="hf-v2u2" id="cap25" class="cap">honest testing,</div><div data-hf-id="hf-kywj" id="cap26" class="cap">and models that can explain themselves.</div><div data-hf-id="hf-gn4n" id="cap27" class="cap">The long plan is big.</div><div data-hf-id="hf-isqq" id="cap28" class="cap">Delivery failure,</div><div data-hf-id="hf-sqr1" id="cap29" class="cap">suspicious orders,</div><div data-hf-id="hf-1r75" id="cap30" class="cap">refund abuse,</div><div data-hf-id="hf-o42y" id="cap31" class="cap">customer behavior.</div><div data-hf-id="hf-a7tf" id="cap32" class="cap">But I am starting with one</div><div data-hf-id="hf-3css" id="cap33" class="cap">question you can actually test.</div><div data-hf-id="hf-xlcv" id="cap34" class="cap">When a customer clicks buy,</div><div data-hf-id="hf-s1l7" id="cap35" class="cap">can we tell if the delivery</div><div data-hf-id="hf-j69p" id="cap36" class="cap">promise will be broken?</div><div data-hf-id="hf-1heb" id="cap37" class="cap">For this,</div><div data-hf-id="hf-715o" id="cap38" class="cap">I am using the Olist dataset.</div><div data-hf-id="hf-jsfz" id="cap39" class="cap">About <span data-hf-id="hf-znel" style="color:#FFB224">100,000</span> real orders from a</div><div data-hf-id="hf-vm65" id="cap40" class="cap">Brazilian marketplace,</div><div data-hf-id="hf-tjg7" id="cap41" class="cap">split across nine tables.</div><div data-hf-id="hf-z21z" id="cap42" class="cap">Orders,</div><div data-hf-id="hf-sbct" id="cap43" class="cap">items,</div><div data-hf-id="hf-b6mr" id="cap44" class="cap">payments,</div><div data-hf-id="hf-9scs" id="cap45" class="cap">customers,</div><div data-hf-id="hf-z0t4" id="cap46" class="cap">sellers,</div><div data-hf-id="hf-ow6j" id="cap47" class="cap">products,</div><div data-hf-id="hf-zo2c" id="cap48" class="cap">reviews and locations.</div><div data-hf-id="hf-2135" id="cap49" class="cap">Here is the code.</div><div data-hf-id="hf-khqb" id="cap50" class="cap">One dictionary comprehension loads all <span data-hf-id="hf-fhwu" style="color:#FFB224">8</span></div><div data-hf-id="hf-7x9x" id="cap51" class="cap">CSV files,</div><div data-hf-id="hf-mziz" id="cap52" class="cap">so I can check rows,</div><div data-hf-id="hf-uinl" id="cap53" class="cap">missing values and duplicates for every</div><div data-hf-id="hf-2xl5" id="cap54" class="cap">table at once.</div><div data-hf-id="hf-7gsc" id="cap55" class="cap">Before writing any model,</div><div data-hf-id="hf-j7g1" id="cap56" class="cap">I wrote down the rules.</div><div data-hf-id="hf-kv6k" id="cap57" class="cap">One row is one order.</div><div data-hf-id="hf-755j" id="cap58" class="cap">The prediction happens at checkout.</div><div data-hf-id="hf-assm" id="cap59" class="cap">So the model may only use</div><div data-hf-id="hf-qyx4" id="cap60" class="cap">what is known at checkout.</div><div data-hf-id="hf-oklk" id="cap61" class="cap">And the final test set gets</div><div data-hf-id="hf-0gny" id="cap62" class="cap">used once.</div><div data-hf-id="hf-z460" id="cap63" class="cap">Only once.</div><div data-hf-id="hf-mj15" id="cap64" class="cap">The first surprise came early.</div><div data-hf-id="hf-g5qr" id="cap65" class="cap">Every order has a new customer</div><div data-hf-id="hf-7l97" id="cap66" class="cap">ID.</div><div data-hf-id="hf-5hd0" id="cap67" class="cap">When I matched people properly,</div><div data-hf-id="hf-305z" id="cap68" class="cap">only <span data-hf-id="hf-45sl" style="color:#FFB224">3.1%</span> of customers ever ordered</div><div data-hf-id="hf-61jb" id="cap69" class="cap">twice.</div><div data-hf-id="hf-ipxx" id="cap70" class="cap">So the idea of judging a</div><div data-hf-id="hf-6bxw" id="cap71" class="cap">customer by their history?</div><div data-hf-id="hf-sxi8" id="cap72" class="cap">On this data,</div><div data-hf-id="hf-z7ni" id="cap73" class="cap">it barely exists.</div><div data-hf-id="hf-64vj" id="cap74" class="cap">The fix is one merge.</div><div data-hf-id="hf-u3cn" id="cap75" class="cap">Join orders to customers,</div><div data-hf-id="hf-0rfo" id="cap76" class="cap">group by the unique customer ID,</div><div data-hf-id="hf-g8id" id="cap77" class="cap">and count how many orders each</div><div data-hf-id="hf-6ej1" id="cap78" class="cap">real person made.</div><div data-hf-id="hf-uqet" id="cap79" class="cap">Next,</div><div data-hf-id="hf-0box" id="cap80" class="cap">cleaning.</div><div data-hf-id="hf-alsl" id="cap81" class="cap">Orders from <span data-hf-id="hf-e3kf" style="color:#FFB224">2016</span> were too few,</div><div data-hf-id="hf-xry3" id="cap82" class="cap">and the last months were not</div><div data-hf-id="hf-d0e9" id="cap83" class="cap">fully delivered yet.</div><div data-hf-id="hf-h9ti" id="cap84" class="cap">So I kept January <span data-hf-id="hf-ehvg" style="color:#FFB224">2017</span> to</div><div data-hf-id="hf-oo4h" id="cap85" class="cap">July <span data-hf-id="hf-2dj1" style="color:#FFB224">2018.</span></div><div data-hf-id="hf-9y7r" id="cap86" class="cap">That left <span data-hf-id="hf-vt4y" style="color:#FFB224">89,852</span> delivered orders.</div><div data-hf-id="hf-mewz" id="cap87" class="cap">And the last month,</div><div data-hf-id="hf-hc38" id="cap88" class="cap">July <span data-hf-id="hf-3653" style="color:#FFB224">2018,</span></div><div data-hf-id="hf-rzk6" id="cap89" class="cap">I locked away completely,</div><div data-hf-id="hf-jhbs" id="cap90" class="cap">for later.</div><div data-hf-id="hf-0y0p" id="cap91" class="cap">Then the target.</div><div data-hf-id="hf-3ic4" id="cap92" class="cap">An order is late if it</div><div data-hf-id="hf-rqe2" id="cap93" class="cap">arrives after the date the customer</div><div data-hf-id="hf-wfk5" id="cap94" class="cap">was promised.</div><div data-hf-id="hf-wsa9" id="cap95" class="cap"><span data-hf-id="hf-1zvh" style="color:#FFB224">6.8%</span> of orders were late.</div><div data-hf-id="hf-lrd8" id="cap96" class="cap">But look at this.</div><div data-hf-id="hf-nlyg" id="cap97" class="cap">The median promise was <span data-hf-id="hf-m0ng" style="color:#FFB224">24</span> days.</div><div data-hf-id="hf-p2xt" id="cap98" class="cap">The median actual delivery was <span data-hf-id="hf-u34i" style="color:#FFB224">11.</span></div><div data-hf-id="hf-npu8" id="cap99" class="cap">Most parcels arrived <span data-hf-id="hf-6lda" style="color:#FFB224">13</span> days early,</div><div data-hf-id="hf-8h3i" id="cap100" class="cap">and still,</div><div data-hf-id="hf-cmkx" id="cap101" class="cap"><span data-hf-id="hf-hhfz" style="color:#FFB224">7</span> in every <span data-hf-id="hf-np9t" style="color:#FFB224">100</span> were late.</div><div data-hf-id="hf-hqxm" id="cap102" class="cap">The label is a single comparison.</div><div data-hf-id="hf-hbf0" id="cap103" class="cap">If the delivery day is later</div><div data-hf-id="hf-dsum" id="cap104" class="cap">than the promised date,</div><div data-hf-id="hf-jkol" id="cap105" class="cap">the order is late.</div><div data-hf-id="hf-rabt" id="cap106" class="cap">Then I print the rate.</div><div data-hf-id="hf-b6tu" id="cap107" class="cap">So the promise is padded,</div><div data-hf-id="hf-bnvg" id="cap108" class="cap">and it still fails.</div><div data-hf-id="hf-4ui4" id="cap109" class="cap">That told me the real problem</div><div data-hf-id="hf-bo8g" id="cap110" class="cap">is not speed.</div><div data-hf-id="hf-sbir" id="cap111" class="cap">It is knowing which orders will</div><div data-hf-id="hf-6y41" id="cap112" class="cap">go wrong.</div><div data-hf-id="hf-hj4n" id="cap113" class="cap">Some places are much worse than</div><div data-hf-id="hf-3e3f" id="cap114" class="cap">others.</div><div data-hf-id="hf-ma1o" id="cap115" class="cap">Customers in Maranhão saw <span data-hf-id="hf-7sk2" style="color:#FFB224">18%</span> of</div><div data-hf-id="hf-9fyw" id="cap116" class="cap">orders arrive late.</div><div data-hf-id="hf-c18e" id="cap117" class="cap">In Ceará,</div><div data-hf-id="hf-69ao" id="cap118" class="cap"><span data-hf-id="hf-sy54" style="color:#FFB224">14%.</span></div><div data-hf-id="hf-4rqj" id="cap119" class="cap">Now the features.</div><div data-hf-id="hf-2z8s" id="cap120" class="cap">Order time,</div><div data-hf-id="hf-3gae" id="cap121" class="cap">number of items,</div><div data-hf-id="hf-romw" id="cap122" class="cap">price,</div><div data-hf-id="hf-h6pn" id="cap123" class="cap">freight,</div><div data-hf-id="hf-m7pj" id="cap124" class="cap">weight,</div><div data-hf-id="hf-n10m" id="cap125" class="cap">payment type,</div><div data-hf-id="hf-0fbf" id="cap126" class="cap">the customer&#x27;s state,</div><div data-hf-id="hf-nd79" id="cap127" class="cap">the seller&#x27;s state,</div><div data-hf-id="hf-qcoi" id="cap128" class="cap">and the distance between them,</div><div data-hf-id="hf-qmjh" id="cap129" class="cap">calculated from their postal codes.</div><div data-hf-id="hf-ji9h" id="cap130" class="cap">One feature needed real care: the</div><div data-hf-id="hf-rhne" id="cap131" class="cap">seller&#x27;s past late rate.</div><div data-hf-id="hf-hhgz" id="cap132" class="cap">It is easy to cheat here</div><div data-hf-id="hf-180h" id="cap133" class="cap">by accident.</div><div data-hf-id="hf-y58c" id="cap134" class="cap">So for every order,</div><div data-hf-id="hf-iyk6" id="cap135" class="cap">I only counted deliveries that had</div><div data-hf-id="hf-kfwz" id="cap136" class="cap">already finished before that order was</div><div data-hf-id="hf-sb7y" id="cap137" class="cap">placed.</div><div data-hf-id="hf-xqvt" id="cap138" class="cap">Nothing from the future.</div><div data-hf-id="hf-pwrr" id="cap139" class="cap">In code,</div><div data-hf-id="hf-8z4b" id="cap140" class="cap">the key is merge as-of,</div><div data-hf-id="hf-j0lf" id="cap141" class="cap">with exact matches turned off.</div><div data-hf-id="hf-5sut" id="cap142" class="cap">Each order can only see deliveries</div><div data-hf-id="hf-vy9s" id="cap143" class="cap">that finished strictly before it was</div><div data-hf-id="hf-fugk" id="cap144" class="cap">placed.</div><div data-hf-id="hf-0wom" id="cap145" class="cap">Then a leakage check in code.</div><div data-hf-id="hf-b4ch" id="cap146" class="cap">Actual delivery date,</div><div data-hf-id="hf-g8es" id="cap147" class="cap">carrier date,</div><div data-hf-id="hf-ikjn" id="cap148" class="cap">review score,</div><div data-hf-id="hf-vuyq" id="cap149" class="cap">final status.</div><div data-hf-id="hf-fop7" id="cap150" class="cap">All of these happen after checkout,</div><div data-hf-id="hf-4pv8" id="cap151" class="cap">so none of them are allowed</div><div data-hf-id="hf-tdl9" id="cap152" class="cap">in.</div><div data-hf-id="hf-rrfm" id="cap153" class="cap">The notebook stops if one sneaks</div><div data-hf-id="hf-4yer" id="cap154" class="cap">in.</div><div data-hf-id="hf-yj4t" id="cap155" class="cap">And the split goes by time,</div><div data-hf-id="hf-yk2r" id="cap156" class="cap">not at random.</div><div data-hf-id="hf-lv5e" id="cap157" class="cap">The oldest <span data-hf-id="hf-ha8o" style="color:#FFB224">70%</span> to train,</div><div data-hf-id="hf-z42j" id="cap158" class="cap">the next <span data-hf-id="hf-5sr8" style="color:#FFB224">15</span> to validate,</div><div data-hf-id="hf-9fx6" id="cap159" class="cap">and the newest <span data-hf-id="hf-vap8" style="color:#FFB224">15</span> to test.</div><div data-hf-id="hf-rn4c" id="cap160" class="cap">Because in real life,</div><div data-hf-id="hf-khyn" id="cap161" class="cap">you always predict the future from</div><div data-hf-id="hf-frg0" id="cap162" class="cap">the past.</div><div data-hf-id="hf-2q7e" id="cap163" class="cap">Because the rows are sorted by</div><div data-hf-id="hf-70h1" id="cap164" class="cap">purchase time,</div><div data-hf-id="hf-p010" id="cap165" class="cap">the split is just two slices.</div><div data-hf-id="hf-h5wa" id="cap166" class="cap">No shuffling,</div><div data-hf-id="hf-nn2x" id="cap167" class="cap">so the future can never leak</div><div data-hf-id="hf-k51z" id="cap168" class="cap">into training.</div><div data-hf-id="hf-v2si" id="cap169" class="cap">First,</div><div data-hf-id="hf-fm6u" id="cap170" class="cap">the baseline.</div><div data-hf-id="hf-cwek" id="cap171" class="cap">A model that just guesses at</div><div data-hf-id="hf-zue2" id="cap172" class="cap">random gets a precision recall score</div><div data-hf-id="hf-som2" id="cap173" class="cap">of <span data-hf-id="hf-yry4" style="color:#FFB224">0.097</span> on validation.</div><div data-hf-id="hf-5ev3" id="cap174" class="cap">Logistic regression reached <span data-hf-id="hf-gvda" style="color:#FFB224">0.22.</span></div><div data-hf-id="hf-x322" id="cap175" class="cap">Then LightGBM reached <span data-hf-id="hf-e2t9" style="color:#FFB224">0.3.</span></div><div data-hf-id="hf-6he5" id="cap176" class="cap">Its top <span data-hf-id="hf-g5ga" style="color:#FFB224">10%</span> most risky orders</div><div data-hf-id="hf-ddos" id="cap177" class="cap">caught <span data-hf-id="hf-gi3p" style="color:#FFB224">35%</span> of all the late</div><div data-hf-id="hf-to3j" id="cap178" class="cap">ones.</div><div data-hf-id="hf-hndt" id="cap179" class="cap">LightGBM gets up to <span data-hf-id="hf-e4io" style="color:#FFB224">2000</span> trees,</div><div data-hf-id="hf-3ela" id="cap180" class="cap">but early stopping watches the validation</div><div data-hf-id="hf-1m4s" id="cap181" class="cap">score and keeps the best round.</div><div data-hf-id="hf-5n7d" id="cap182" class="cap">Here,</div><div data-hf-id="hf-bsqk" id="cap183" class="cap">that was round <span data-hf-id="hf-f4dd" style="color:#FFB224">78.</span></div><div data-hf-id="hf-m45x" id="cap184" class="cap">I calibrated the scores on the</div><div data-hf-id="hf-kbk3" id="cap185" class="cap">validation set,</div><div data-hf-id="hf-7ezn" id="cap186" class="cap">so a <span data-hf-id="hf-l744" style="color:#FFB224">30%</span> risk should mean</div><div data-hf-id="hf-tmmi" id="cap187" class="cap">roughly <span data-hf-id="hf-tvby" style="color:#FFB224">30%.</span></div><div data-hf-id="hf-olgx" id="cap188" class="cap">Then I opened the test set.</div><div data-hf-id="hf-4wx7" id="cap189" class="cap">Once.</div><div data-hf-id="hf-gvs8" id="cap190" class="cap">And the score dropped.</div><div data-hf-id="hf-8g1w" id="cap191" class="cap">On the test months,</div><div data-hf-id="hf-3sv4" id="cap192" class="cap">LightGBM scored <span data-hf-id="hf-yip3" style="color:#FFB224">0.10,</span></div><div data-hf-id="hf-cxny" id="cap193" class="cap">Random would be <span data-hf-id="hf-8efc" style="color:#FFB224">0.04,</span></div><div data-hf-id="hf-7j3w" id="cap194" class="cap">So it still finds late orders</div><div data-hf-id="hf-xybp" id="cap195" class="cap">about two and a half times</div><div data-hf-id="hf-kyl0" id="cap196" class="cap">better than guessing.</div><div data-hf-id="hf-ww9o" id="cap197" class="cap">But not the number I hoped</div><div data-hf-id="hf-8gij" id="cap198" class="cap">for.</div><div data-hf-id="hf-cwa7" id="cap199" class="cap">Turning scores into review bands helped.</div><div data-hf-id="hf-uo3f" id="cap200" class="cap">Orders marked low risk were late</div><div data-hf-id="hf-ytri" id="cap201" class="cap"><span data-hf-id="hf-oq3v" style="color:#FFB224">3.3%</span> of the time.</div><div data-hf-id="hf-kvbx" id="cap202" class="cap">Moderate,</div><div data-hf-id="hf-eh97" id="cap203" class="cap"><span data-hf-id="hf-wdiz" style="color:#FFB224">11%.</span></div><div data-hf-id="hf-2snw" id="cap204" class="cap">High,</div><div data-hf-id="hf-rrfh" id="cap205" class="cap"><span data-hf-id="hf-yb0j" style="color:#FFB224">20%.</span></div><div data-hf-id="hf-vwdu" id="cap206" class="cap">That is a list a support</div><div data-hf-id="hf-5omy" id="cap207" class="cap">team could actually work through.</div><div data-hf-id="hf-22sx" id="cap208" class="cap">I also asked the model to</div><div data-hf-id="hf-msch" id="cap209" class="cap">explain itself,</div><div data-hf-id="hf-u46p" id="cap210" class="cap">using SHAP.</div><div data-hf-id="hf-tm94" id="cap211" class="cap">The biggest factors were the month</div><div data-hf-id="hf-dl9d" id="cap212" class="cap">of the order,</div><div data-hf-id="hf-k4hq" id="cap213" class="cap">the customer&#x27;s state,</div><div data-hf-id="hf-n1yv" id="cap214" class="cap">how many days were promised,</div><div data-hf-id="hf-gpz1" id="cap215" class="cap">and the seller&#x27;s past late rate.</div><div data-hf-id="hf-dcsq" id="cap216" class="cap">That first factor bothered me.</div><div data-hf-id="hf-gbfd" id="cap217" class="cap">The calendar month.</div><div data-hf-id="hf-tvjd" id="cap218" class="cap">It means the model partly memorised</div><div data-hf-id="hf-q9j9" id="cap219" class="cap">which months were bad last year.</div><div data-hf-id="hf-oz3p" id="cap220" class="cap">Keep that in mind.</div><div data-hf-id="hf-if8y" id="cap221" class="cap">Then my favourite experiment.</div><div data-hf-id="hf-amnd" id="cap222" class="cap">Instead of only flagging risk,</div><div data-hf-id="hf-sxm0" id="cap223" class="cap">can we promise a better date?</div><div data-hf-id="hf-ba9s" id="cap224" class="cap">I trained a model to predict</div><div data-hf-id="hf-ze1s" id="cap225" class="cap">delivery time at a chosen confidence</div><div data-hf-id="hf-2j4m" id="cap226" class="cap">level,</div><div data-hf-id="hf-dnhh" id="cap227" class="cap">and picked that level on validation.</div><div data-hf-id="hf-29qf" id="cap228" class="cap">The promise model is LightGBM again,</div><div data-hf-id="hf-4hn0" id="cap229" class="cap">with a quantile objective.</div><div data-hf-id="hf-3vst" id="cap230" class="cap">Alpha sets how cautious the promise</div><div data-hf-id="hf-rhx6" id="cap231" class="cap">is.</div><div data-hf-id="hf-kqon" id="cap232" class="cap">I tried six levels,</div><div data-hf-id="hf-r7w0" id="cap233" class="cap">and let validation choose.</div><div data-hf-id="hf-jkm4" id="cap234" class="cap">On the test months it promised</div><div data-hf-id="hf-vk10" id="cap235" class="cap">orders <span data-hf-id="hf-ye6i" style="color:#FFB224">9.3</span> days sooner.</div><div data-hf-id="hf-v1yo" id="cap236" class="cap">Sounds great.</div><div data-hf-id="hf-lqv3" id="cap237" class="cap">But <span data-hf-id="hf-x58l" style="color:#FFB224">10.9%</span> of them arrived late,</div><div data-hf-id="hf-s1fc" id="cap238" class="cap">against <span data-hf-id="hf-bimd" style="color:#FFB224">4%</span> for Olist.</div><div data-hf-id="hf-zb46" id="cap239" class="cap">My first experiment failed.</div><div data-hf-id="hf-80c5" id="cap240" class="cap">So I went looking for why.</div><div data-hf-id="hf-upiv" id="cap241" class="cap">Here is the weekly late rate.</div><div data-hf-id="hf-pcsp" id="cap242" class="cap">Late deliveries jumped to around <span data-hf-id="hf-b0qd" style="color:#FFB224">26%</span></div><div data-hf-id="hf-iqg0" id="cap243" class="cap">in February and March <span data-hf-id="hf-dmfr" style="color:#FFB224">2018,</span></div><div data-hf-id="hf-7i69" id="cap244" class="cap">right where my validation set sits.</div><div data-hf-id="hf-chzv" id="cap245" class="cap">Then it calmed down in the</div><div data-hf-id="hf-ctk5" id="cap246" class="cap">test months.</div><div data-hf-id="hf-d5ba" id="cap247" class="cap">The world changed,</div><div data-hf-id="hf-l14f" id="cap248" class="cap">and my model had no way</div><div data-hf-id="hf-fa7n" id="cap249" class="cap">to know.</div><div data-hf-id="hf-tldm" id="cap250" class="cap">The fix had to be something</div><div data-hf-id="hf-ft89" id="cap251" class="cap">you can know at checkout.</div><div data-hf-id="hf-1k29" id="cap252" class="cap">So I added one more signal:</div><div data-hf-id="hf-xkex" id="cap253" class="cap">how late deliveries have been in</div><div data-hf-id="hf-eky3" id="cap254" class="cap">the last <span data-hf-id="hf-5gcp" style="color:#FFB224">30</span> days,</div><div data-hf-id="hf-wemf" id="cap255" class="cap">overall and to the customer&#x27;s state.</div><div data-hf-id="hf-uoi0" id="cap256" class="cap">Only deliveries already finished count.</div><div data-hf-id="hf-9i51" id="cap257" class="cap">Two binary searches find every delivery</div><div data-hf-id="hf-tg5n" id="cap258" class="cap">that finished in the <span data-hf-id="hf-q41p" style="color:#FFB224">30</span> days</div><div data-hf-id="hf-w66w" id="cap259" class="cap">before each order.</div><div data-hf-id="hf-bc1i" id="cap260" class="cap">With fewer than <span data-hf-id="hf-mjt0" style="color:#FFB224">20,</span></div><div data-hf-id="hf-kcba" id="cap261" class="cap">the value stays empty.</div><div data-hf-id="hf-vbp4" id="cap262" class="cap">To judge it fairly,</div><div data-hf-id="hf-uaym" id="cap263" class="cap">I finally unlocked July <span data-hf-id="hf-m7td" style="color:#FFB224">2018.</span></div><div data-hf-id="hf-cerv" id="cap264" class="cap"><span data-hf-id="hf-k08c" style="color:#FFB224">6,156</span> orders that no model and</div><div data-hf-id="hf-bt63" id="cap265" class="cap">no decision had ever touched.</div><div data-hf-id="hf-64y7" id="cap266" class="cap">The risk model still found late</div><div data-hf-id="hf-3wor" id="cap267" class="cap">orders about twice as well as</div><div data-hf-id="hf-j0xt" id="cap268" class="cap">random.</div><div data-hf-id="hf-6s5f" id="cap269" class="cap">The new promise was <span data-hf-id="hf-tmp8" style="color:#FFB224">3.3</span> days</div><div data-hf-id="hf-63i6" id="cap270" class="cap">shorter than Olist&#x27;s,</div><div data-hf-id="hf-cupl" id="cap271" class="cap"><span data-hf-id="hf-f4wr" style="color:#FFB224">20.3</span> down to <span data-hf-id="hf-hd4s" style="color:#FFB224">17.</span></div><div data-hf-id="hf-pwt7" id="cap272" class="cap">But late deliveries went up from</div><div data-hf-id="hf-iwlf" id="cap273" class="cap"><span data-hf-id="hf-u109" style="color:#FFB224">3.4</span> to <span data-hf-id="hf-l0qk" style="color:#FFB224">5.8%.</span></div><div data-hf-id="hf-jn2l" id="cap274" class="cap">So,</div><div data-hf-id="hf-nycf" id="cap275" class="cap">not a magic win.</div><div data-hf-id="hf-uk2d" id="cap276" class="cap">A real trade off.</div><div data-hf-id="hf-obks" id="cap277" class="cap">Promise faster,</div><div data-hf-id="hf-tpe4" id="cap278" class="cap">and accept a few more late</div><div data-hf-id="hf-4vf8" id="cap279" class="cap">parcels.</div><div data-hf-id="hf-7rfb" id="cap280" class="cap">Or keep the safe promise.</div><div data-hf-id="hf-r0qz" id="cap281" class="cap">Now that choice can be made</div><div data-hf-id="hf-fuio" id="cap282" class="cap">with numbers,</div><div data-hf-id="hf-glkp" id="cap283" class="cap">not guesses.</div><div data-hf-id="hf-apdx" id="cap284" class="cap">This is episode one.</div><div data-hf-id="hf-73p2" id="cap285" class="cap">The data is from Brazil,</div><div data-hf-id="hf-5hnl" id="cap286" class="cap">and late is not the same</div><div data-hf-id="hf-yhzf" id="cap287" class="cap">as a failed delivery.</div><div data-hf-id="hf-gjh3" id="cap288" class="cap">Next,</div><div data-hf-id="hf-p4e8" id="cap289" class="cap">I want to work on cash</div><div data-hf-id="hf-li0z" id="cap290" class="cap">on delivery failures,</div><div data-hf-id="hf-o4q0" id="cap291" class="cap">with real data from Bangladeshi sellers.</div><div data-hf-id="hf-rsln" id="cap292" class="cap">The full notebook is on my</div><div data-hf-id="hf-5cap" id="cap293" class="cap">GitHub,</div><div data-hf-id="hf-rzxr" id="cap294" class="cap">link in the description.</div><div data-hf-id="hf-j16r" id="cap295" class="cap">One step at a time.</div><div data-hf-id="hf-m1el" id="cap296" class="cap">One model at a time.</div><div data-hf-id="hf-f3vq" id="cap297" class="cap">CommerceGuard.</div><div data-hf-id="hf-xqsj" id="cap298" class="cap">Predict risk.</div><div data-hf-id="hf-30mw" id="cap299" class="cap">Understand behavior.</div><div data-hf-id="hf-mmbm" id="cap300" class="cap">Reduce preventable losses.</div></div>
