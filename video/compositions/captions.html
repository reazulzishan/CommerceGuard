<div id="root" data-composition-id="captions" data-width="1920" data-height="1080"><div id="cap0" class="cap">What if an online store could</div><div id="cap1" class="cap">see a loss coming,</div><div id="cap2" class="cap">before it actually happens?</div><div id="cap3" class="cap">Think about this.</div><div id="cap4" class="cap">Every day,</div><div id="cap5" class="cap">thousands of orders are placed online.</div><div id="cap6" class="cap">But not every order ends well.</div><div id="cap7" class="cap">Some customers reject the parcel at</div><div id="cap8" class="cap">the door.</div><div id="cap9" class="cap">Some orders get cancelled again and</div><div id="cap10" class="cap">again.</div><div id="cap11" class="cap">Some returns and refunds quietly eat</div><div id="cap12" class="cap">the profit.</div><div id="cap13" class="cap">And most businesses only find out</div><div id="cap14" class="cap">after the damage is done.</div><div id="cap15" class="cap">So I asked a simple question.</div><div id="cap16" class="cap">What if we could see the</div><div id="cap17" class="cap">warning signs earlier?</div><div id="cap18" class="cap">That is the idea behind CommerceGuard.</div><div id="cap19" class="cap">A risk system for e-commerce,</div><div id="cap20" class="cap">built from scratch with machine learning.</div><div id="cap21" class="cap">No ready-made AI.</div><div id="cap22" class="cap">No large language models.</div><div id="cap23" class="cap">Just real data,</div><div id="cap24" class="cap">careful features,</div><div id="cap25" class="cap">honest testing,</div><div id="cap26" class="cap">and models that can explain themselves.</div><div id="cap27" class="cap">The long plan is big.</div><div id="cap28" class="cap">Delivery failure,</div><div id="cap29" class="cap">suspicious orders,</div><div id="cap30" class="cap">refund abuse,</div><div id="cap31" class="cap">customer behavior.</div><div id="cap32" class="cap">But I am starting with one</div><div id="cap33" class="cap">question you can actually test.</div><div id="cap34" class="cap">When a customer clicks buy,</div><div id="cap35" class="cap">can we tell if the delivery</div><div id="cap36" class="cap">promise will be broken?</div><div id="cap37" class="cap">For this,</div><div id="cap38" class="cap">I am using the Olist dataset.</div><div id="cap39" class="cap">About <span style="color:#FFB224">100,000</span> real orders from a</div><div id="cap40" class="cap">Brazilian marketplace,</div><div id="cap41" class="cap">split across nine tables.</div><div id="cap42" class="cap">Orders,</div><div id="cap43" class="cap">items,</div><div id="cap44" class="cap">payments,</div><div id="cap45" class="cap">customers,</div><div id="cap46" class="cap">sellers,</div><div id="cap47" class="cap">products,</div><div id="cap48" class="cap">reviews and locations.</div><div id="cap49" class="cap">Here is the code.</div><div id="cap50" class="cap">One dictionary comprehension loads all <span style="color:#FFB224">8</span></div><div id="cap51" class="cap">CSV files,</div><div id="cap52" class="cap">so I can check rows,</div><div id="cap53" class="cap">missing values and duplicates for every</div><div id="cap54" class="cap">table at once.</div><div id="cap55" class="cap">Before writing any model,</div><div id="cap56" class="cap">I wrote down the rules.</div><div id="cap57" class="cap">One row is one order.</div><div id="cap58" class="cap">The prediction happens at checkout.</div><div id="cap59" class="cap">So the model may only use</div><div id="cap60" class="cap">what is known at checkout.</div><div id="cap61" class="cap">And the final test set gets</div><div id="cap62" class="cap">used once.</div><div id="cap63" class="cap">Only once.</div><div id="cap64" class="cap">The first surprise came early.</div><div id="cap65" class="cap">Every order has a new customer</div><div id="cap66" class="cap">ID.</div><div id="cap67" class="cap">When I matched people properly,</div><div id="cap68" class="cap">only <span style="color:#FFB224">3.1%</span> of customers ever ordered</div><div id="cap69" class="cap">twice.</div><div id="cap70" class="cap">So the idea of judging a</div><div id="cap71" class="cap">customer by their history?</div><div id="cap72" class="cap">On this data,</div><div id="cap73" class="cap">it barely exists.</div><div id="cap74" class="cap">The fix is one merge.</div><div id="cap75" class="cap">Join orders to customers,</div><div id="cap76" class="cap">group by the unique customer ID,</div><div id="cap77" class="cap">and count how many orders each</div><div id="cap78" class="cap">real person made.</div><div id="cap79" class="cap">Next,</div><div id="cap80" class="cap">cleaning.</div><div id="cap81" class="cap">Orders from <span style="color:#FFB224">2016</span> were too few,</div><div id="cap82" class="cap">and the last months were not</div><div id="cap83" class="cap">fully delivered yet.</div><div id="cap84" class="cap">So I kept January <span style="color:#FFB224">2017</span> to</div><div id="cap85" class="cap">July <span style="color:#FFB224">2018.</span></div><div id="cap86" class="cap">That left <span style="color:#FFB224">89,852</span> delivered orders.</div><div id="cap87" class="cap">And the last month,</div><div id="cap88" class="cap">July <span style="color:#FFB224">2018,</span></div><div id="cap89" class="cap">I locked away completely,</div><div id="cap90" class="cap">for later.</div><div id="cap91" class="cap">Then the target.</div><div id="cap92" class="cap">An order is late if it</div><div id="cap93" class="cap">arrives after the date the customer</div><div id="cap94" class="cap">was promised.</div><div id="cap95" class="cap"><span style="color:#FFB224">6.8%</span> of orders were late.</div><div id="cap96" class="cap">But look at this.</div><div id="cap97" class="cap">The median promise was <span style="color:#FFB224">24</span> days.</div><div id="cap98" class="cap">The median actual delivery was <span style="color:#FFB224">11.</span></div><div id="cap99" class="cap">Most parcels arrived <span style="color:#FFB224">13</span> days early,</div><div id="cap100" class="cap">and still,</div><div id="cap101" class="cap"><span style="color:#FFB224">7</span> in every <span style="color:#FFB224">100</span> were late.</div><div id="cap102" class="cap">The label is a single comparison.</div><div id="cap103" class="cap">If the delivery day is later</div><div id="cap104" class="cap">than the promised date,</div><div id="cap105" class="cap">the order is late.</div><div id="cap106" class="cap">Then I print the rate.</div><div id="cap107" class="cap">So the promise is padded,</div><div id="cap108" class="cap">and it still fails.</div><div id="cap109" class="cap">That told me the real problem</div><div id="cap110" class="cap">is not speed.</div><div id="cap111" class="cap">It is knowing which orders will</div><div id="cap112" class="cap">go wrong.</div><div id="cap113" class="cap">Some places are much worse than</div><div id="cap114" class="cap">others.</div><div id="cap115" class="cap">Customers in Maranhão saw <span style="color:#FFB224">18%</span> of</div><div id="cap116" class="cap">orders arrive late.</div><div id="cap117" class="cap">In Ceará,</div><div id="cap118" class="cap"><span style="color:#FFB224">14%.</span></div><div id="cap119" class="cap">Now the features.</div><div id="cap120" class="cap">Order time,</div><div id="cap121" class="cap">number of items,</div><div id="cap122" class="cap">price,</div><div id="cap123" class="cap">freight,</div><div id="cap124" class="cap">weight,</div><div id="cap125" class="cap">payment type,</div><div id="cap126" class="cap">the customer&#x27;s state,</div><div id="cap127" class="cap">the seller&#x27;s state,</div><div id="cap128" class="cap">and the distance between them,</div><div id="cap129" class="cap">calculated from their postal codes.</div><div id="cap130" class="cap">One feature needed real care: the</div><div id="cap131" class="cap">seller&#x27;s past late rate.</div><div id="cap132" class="cap">It is easy to cheat here</div><div id="cap133" class="cap">by accident.</div><div id="cap134" class="cap">So for every order,</div><div id="cap135" class="cap">I only counted deliveries that had</div><div id="cap136" class="cap">already finished before that order was</div><div id="cap137" class="cap">placed.</div><div id="cap138" class="cap">Nothing from the future.</div><div id="cap139" class="cap">In code,</div><div id="cap140" class="cap">the key is merge as-of,</div><div id="cap141" class="cap">with exact matches turned off.</div><div id="cap142" class="cap">Each order can only see deliveries</div><div id="cap143" class="cap">that finished strictly before it was</div><div id="cap144" class="cap">placed.</div><div id="cap145" class="cap">Then a leakage check in code.</div><div id="cap146" class="cap">Actual delivery date,</div><div id="cap147" class="cap">carrier date,</div><div id="cap148" class="cap">review score,</div><div id="cap149" class="cap">final status.</div><div id="cap150" class="cap">All of these happen after checkout,</div><div id="cap151" class="cap">so none of them are allowed</div><div id="cap152" class="cap">in.</div><div id="cap153" class="cap">The notebook stops if one sneaks</div><div id="cap154" class="cap">in.</div><div id="cap155" class="cap">And the split goes by time,</div><div id="cap156" class="cap">not at random.</div><div id="cap157" class="cap">The oldest <span style="color:#FFB224">70%</span> to train,</div><div id="cap158" class="cap">the next <span style="color:#FFB224">15</span> to validate,</div><div id="cap159" class="cap">and the newest <span style="color:#FFB224">15</span> to test.</div><div id="cap160" class="cap">Because in real life,</div><div id="cap161" class="cap">you always predict the future from</div><div id="cap162" class="cap">the past.</div><div id="cap163" class="cap">Because the rows are sorted by</div><div id="cap164" class="cap">purchase time,</div><div id="cap165" class="cap">the split is just two slices.</div><div id="cap166" class="cap">No shuffling,</div><div id="cap167" class="cap">so the future can never leak</div><div id="cap168" class="cap">into training.</div><div id="cap169" class="cap">First,</div><div id="cap170" class="cap">the baseline.</div><div id="cap171" class="cap">A model that just guesses at</div><div id="cap172" class="cap">random gets a precision recall score</div><div id="cap173" class="cap">of <span style="color:#FFB224">0.097</span> on validation.</div><div id="cap174" class="cap">Logistic regression reached <span style="color:#FFB224">0.22.</span></div><div id="cap175" class="cap">Then LightGBM reached <span style="color:#FFB224">0.3.</span></div><div id="cap176" class="cap">Its top <span style="color:#FFB224">10%</span> most risky orders</div><div id="cap177" class="cap">caught <span style="color:#FFB224">35%</span> of all the late</div><div id="cap178" class="cap">ones.</div><div id="cap179" class="cap">LightGBM gets up to <span style="color:#FFB224">2000</span> trees,</div><div id="cap180" class="cap">but early stopping watches the validation</div><div id="cap181" class="cap">score and keeps the best round.</div><div id="cap182" class="cap">Here,</div><div id="cap183" class="cap">that was round <span style="color:#FFB224">78.</span></div><div id="cap184" class="cap">I calibrated the scores on the</div><div id="cap185" class="cap">validation set,</div><div id="cap186" class="cap">so a <span style="color:#FFB224">30%</span> risk should mean</div><div id="cap187" class="cap">roughly <span style="color:#FFB224">30%.</span></div><div id="cap188" class="cap">Then I opened the test set.</div><div id="cap189" class="cap">Once.</div><div id="cap190" class="cap">And the score dropped.</div><div id="cap191" class="cap">On the test months,</div><div id="cap192" class="cap">LightGBM scored <span style="color:#FFB224">0.10,</span></div><div id="cap193" class="cap">Random would be <span style="color:#FFB224">0.04,</span></div><div id="cap194" class="cap">So it still finds late orders</div><div id="cap195" class="cap">about two and a half times</div><div id="cap196" class="cap">better than guessing.</div><div id="cap197" class="cap">But not the number I hoped</div><div id="cap198" class="cap">for.</div><div id="cap199" class="cap">Turning scores into review bands helped.</div><div id="cap200" class="cap">Orders marked low risk were late</div><div id="cap201" class="cap"><span style="color:#FFB224">3.3%</span> of the time.</div><div id="cap202" class="cap">Moderate,</div><div id="cap203" class="cap"><span style="color:#FFB224">11%.</span></div><div id="cap204" class="cap">High,</div><div id="cap205" class="cap"><span style="color:#FFB224">20%.</span></div><div id="cap206" class="cap">That is a list a support</div><div id="cap207" class="cap">team could actually work through.</div><div id="cap208" class="cap">I also asked the model to</div><div id="cap209" class="cap">explain itself,</div><div id="cap210" class="cap">using SHAP.</div><div id="cap211" class="cap">The biggest factors were the month</div><div id="cap212" class="cap">of the order,</div><div id="cap213" class="cap">the customer&#x27;s state,</div><div id="cap214" class="cap">how many days were promised,</div><div id="cap215" class="cap">and the seller&#x27;s past late rate.</div><div id="cap216" class="cap">That first factor bothered me.</div><div id="cap217" class="cap">The calendar month.</div><div id="cap218" class="cap">It means the model partly memorised</div><div id="cap219" class="cap">which months were bad last year.</div><div id="cap220" class="cap">Keep that in mind.</div><div id="cap221" class="cap">Then my favourite experiment.</div><div id="cap222" class="cap">Instead of only flagging risk,</div><div id="cap223" class="cap">can we promise a better date?</div><div id="cap224" class="cap">I trained a model to predict</div><div id="cap225" class="cap">delivery time at a chosen confidence</div><div id="cap226" class="cap">level,</div><div id="cap227" class="cap">and picked that level on validation.</div><div id="cap228" class="cap">The promise model is LightGBM again,</div><div id="cap229" class="cap">with a quantile objective.</div><div id="cap230" class="cap">Alpha sets how cautious the promise</div><div id="cap231" class="cap">is.</div><div id="cap232" class="cap">I tried six levels,</div><div id="cap233" class="cap">and let validation choose.</div><div id="cap234" class="cap">On the test months it promised</div><div id="cap235" class="cap">orders <span style="color:#FFB224">9.3</span> days sooner.</div><div id="cap236" class="cap">Sounds great.</div><div id="cap237" class="cap">But <span style="color:#FFB224">10.9%</span> of them arrived late,</div><div id="cap238" class="cap">against <span style="color:#FFB224">4%</span> for Olist.</div><div id="cap239" class="cap">My first experiment failed.</div><div id="cap240" class="cap">So I went looking for why.</div><div id="cap241" class="cap">Here is the weekly late rate.</div><div id="cap242" class="cap">Late deliveries jumped to around <span style="color:#FFB224">26%</span></div><div id="cap243" class="cap">in February and March <span style="color:#FFB224">2018,</span></div><div id="cap244" class="cap">right where my validation set sits.</div><div id="cap245" class="cap">Then it calmed down in the</div><div id="cap246" class="cap">test months.</div><div id="cap247" class="cap">The world changed,</div><div id="cap248" class="cap">and my model had no way</div><div id="cap249" class="cap">to know.</div><div id="cap250" class="cap">The fix had to be something</div><div id="cap251" class="cap">you can know at checkout.</div><div id="cap252" class="cap">So I added one more signal:</div><div id="cap253" class="cap">how late deliveries have been in</div><div id="cap254" class="cap">the last <span style="color:#FFB224">30</span> days,</div><div id="cap255" class="cap">overall and to the customer&#x27;s state.</div><div id="cap256" class="cap">Only deliveries already finished count.</div><div id="cap257" class="cap">Two binary searches find every delivery</div><div id="cap258" class="cap">that finished in the <span style="color:#FFB224">30</span> days</div><div id="cap259" class="cap">before each order.</div><div id="cap260" class="cap">With fewer than <span style="color:#FFB224">20,</span></div><div id="cap261" class="cap">the value stays empty.</div><div id="cap262" class="cap">To judge it fairly,</div><div id="cap263" class="cap">I finally unlocked July <span style="color:#FFB224">2018.</span></div><div id="cap264" class="cap"><span style="color:#FFB224">6,156</span> orders that no model and</div><div id="cap265" class="cap">no decision had ever touched.</div><div id="cap266" class="cap">The risk model still found late</div><div id="cap267" class="cap">orders about twice as well as</div><div id="cap268" class="cap">random.</div><div id="cap269" class="cap">The new promise was <span style="color:#FFB224">3.3</span> days</div><div id="cap270" class="cap">shorter than Olist&#x27;s,</div><div id="cap271" class="cap"><span style="color:#FFB224">20.3</span> down to <span style="color:#FFB224">17.</span></div><div id="cap272" class="cap">But late deliveries went up from</div><div id="cap273" class="cap"><span style="color:#FFB224">3.4</span> to <span style="color:#FFB224">5.8%.</span></div><div id="cap274" class="cap">So,</div><div id="cap275" class="cap">not a magic win.</div><div id="cap276" class="cap">A real trade off.</div><div id="cap277" class="cap">Promise faster,</div><div id="cap278" class="cap">and accept a few more late</div><div id="cap279" class="cap">parcels.</div><div id="cap280" class="cap">Or keep the safe promise.</div><div id="cap281" class="cap">Now that choice can be made</div><div id="cap282" class="cap">with numbers,</div><div id="cap283" class="cap">not guesses.</div><div id="cap284" class="cap">This is episode one.</div><div id="cap285" class="cap">The data is from Brazil,</div><div id="cap286" class="cap">and late is not the same</div><div id="cap287" class="cap">as a failed delivery.</div><div id="cap288" class="cap">Next,</div><div id="cap289" class="cap">I want to work on cash</div><div id="cap290" class="cap">on delivery failures,</div><div id="cap291" class="cap">with real data from Bangladeshi sellers.</div><div id="cap292" class="cap">I will share the full notebook</div><div id="cap293" class="cap">in the next episode,</div><div id="cap294" class="cap">once CommerceGuard becomes a multi-model system.</div><div id="cap295" class="cap">One step at a time.</div><div id="cap296" class="cap">One model at a time.</div><div id="cap297" class="cap">CommerceGuard.</div><div id="cap298" class="cap">Predict risk.</div><div id="cap299" class="cap">Understand behavior.</div><div id="cap300" class="cap">Reduce preventable losses.</div></div>
