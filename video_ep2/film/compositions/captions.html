<div id="root" data-composition-id="captions" data-width="1920" data-height="1080"><div id="cap0" class="cap">This is Dhaka.</div><div id="cap1" class="cap">Every day,</div><div id="cap2" class="cap">thousands of small online shops send</div><div id="cap3" class="cap">parcels across this city.</div><div id="cap4" class="cap">This one belongs to Rafi.</div><div id="cap5" class="cap">Nadia likes a dress on his</div><div id="cap6" class="cap">page.</div><div id="cap7" class="cap">She sends one message,</div><div id="cap8" class="cap">the most common message in Bangladeshi</div><div id="cap9" class="cap">e-commerce.</div><div id="cap10" class="cap">Cash on delivery,</div><div id="cap11" class="cap">right?</div><div id="cap12" class="cap">Rafi says yes.</div><div id="cap13" class="cap">He packs the dress,</div><div id="cap14" class="cap">pays the courier,</div><div id="cap15" class="cap">and the parcel leaves his shop.</div><div id="cap16" class="cap">Three days later,</div><div id="cap17" class="cap">it still hasn&#x27;t arrived.</div><div id="cap18" class="cap">Nadia writes again,</div><div id="cap19" class="cap">and this time,</div><div id="cap20" class="cap">the tone has changed.</div><div id="cap21" class="cap">When the parcel finally reaches her</div><div id="cap22" class="cap">door,</div><div id="cap23" class="cap">she opens it in front of</div><div id="cap24" class="cap">the rider.</div><div id="cap25" class="cap">It does not look like the</div><div id="cap26" class="cap">photo.</div><div id="cap27" class="cap">She refuses it.</div><div id="cap28" class="cap">The parcel goes back to Rafi.</div><div id="cap29" class="cap">He gets no money,</div><div id="cap30" class="cap">he loses the delivery charge both</div><div id="cap31" class="cap">ways,</div><div id="cap32" class="cap">and the dress comes back used.</div><div id="cap33" class="cap">This is not one unlucky seller.</div><div id="cap34" class="cap">Courier companies themselves say a typical</div><div id="cap35" class="cap">shop delivers only <span style="color:#FFB224">75-85%</span> to of</div><div id="cap36" class="cap">its parcels.</div><div id="cap37" class="cap">So why does almost everyone in</div><div id="cap38" class="cap">Bangladesh pay cash at the door?</div><div id="cap39" class="cap">To understand that,</div><div id="cap40" class="cap">we have to go back to</div><div id="cap41" class="cap"><span style="color:#FFB224">2021.</span></div><div id="cap42" class="cap">Platforms like Evaly and e-Orange took</div><div id="cap43" class="cap">money in advance with huge discounts.</div><div id="cap44" class="cap">Then the deliveries stopped.</div><div id="cap45" class="cap">Officials put the money stuck in</div><div id="cap46" class="cap">just three of these companies at</div><div id="cap47" class="cap">around <span style="color:#FFB224">3,000</span> crore taka.</div><div id="cap48" class="cap">By September <span style="color:#FFB224">2022,</span></div><div id="cap49" class="cap">only about <span style="color:#FFB224">250</span> crore had gone</div><div id="cap50" class="cap">back,</div><div id="cap51" class="cap">to around <span style="color:#FFB224">29,000</span> customers.</div><div id="cap52" class="cap">After that,</div><div id="cap53" class="cap">people stopped trusting advance payment.</div><div id="cap54" class="cap">Cash on delivery became the shield.</div><div id="cap55" class="cap">But a shield for the buyer</div><div id="cap56" class="cap">moves the risk to the seller.</div><div id="cap57" class="cap">So this is the question for</div><div id="cap58" class="cap">CommerceGuard.</div><div id="cap59" class="cap">Can machine learning warn Rafi before</div><div id="cap60" class="cap">the parcel leaves,</div><div id="cap61" class="cap">not after it comes back?</div><div id="cap62" class="cap">I built three models.</div><div id="cap63" class="cap">The first one listens to the</div><div id="cap64" class="cap">customer.</div><div id="cap65" class="cap">The second one looks at the</div><div id="cap66" class="cap">order.</div><div id="cap67" class="cap">The third,</div><div id="cap68" class="cap">from episode one,</div><div id="cap69" class="cap">watches the delivery.</div><div id="cap70" class="cap">For the customer&#x27;s voice,</div><div id="cap71" class="cap">I used a public dataset of</div><div id="cap72" class="cap">real reviews from Daraz and Pickaboo.</div><div id="cap73" class="cap"><span style="color:#FFB224">78,000</span> reviews,</div><div id="cap74" class="cap">in Bangla and English.</div><div id="cap75" class="cap">First trap: almost <span style="color:#FFB224">14,000</span> reviews were</div><div id="cap76" class="cap">exact copies.</div><div id="cap77" class="cap">After removing them,</div><div id="cap78" class="cap"><span style="color:#FFB224">64,000</span> were left,</div><div id="cap79" class="cap">and <span style="color:#FFB224">16%</span> were unhappy.</div><div id="cap80" class="cap">And what do unhappy customers talk</div><div id="cap81" class="cap">about?</div><div id="cap82" class="cap">They mention returns and refunds <span style="color:#FFB224">15</span></div><div id="cap83" class="cap">times more often than happy ones,</div><div id="cap84" class="cap">and damaged products <span style="color:#FFB224">12</span> times more.</div><div id="cap85" class="cap">Second trap: reviews of the same</div><div id="cap86" class="cap">product share words.</div><div id="cap87" class="cap">So I split by product.</div><div id="cap88" class="cap">No product appears in both training</div><div id="cap89" class="cap">and test.</div><div id="cap90" class="cap">The model reads only the text,</div><div id="cap91" class="cap">never the star rating,</div><div id="cap92" class="cap">because a chat message has no</div><div id="cap93" class="cap">stars.</div><div id="cap94" class="cap">Characters and words together,</div><div id="cap95" class="cap">with logistic regression.</div><div id="cap96" class="cap">On reviews from products it had</div><div id="cap97" class="cap">never seen,</div><div id="cap98" class="cap">it scored <span style="color:#FFB224">0.82</span> on precision recall.</div><div id="cap99" class="cap">Random guessing scores <span style="color:#FFB224">0.17.</span></div><div id="cap100" class="cap">And on Bangla reviews,</div><div id="cap101" class="cap">it did even better: <span style="color:#FFB224">0.86.</span></div><div id="cap102" class="cap">Now the order itself.</div><div id="cap103" class="cap">There is no public dataset that</div><div id="cap104" class="cap">shows what happened to Bangladeshi orders.</div><div id="cap105" class="cap">So I used the closest real</div><div id="cap106" class="cap">dataset: more than half a million</div><div id="cap107" class="cap">order items from a cash on</div><div id="cap108" class="cap">delivery market in Pakistan,</div><div id="cap109" class="cap">from <span style="color:#FFB224">2016</span> to <span style="color:#FFB224">2018.</span></div><div id="cap110" class="cap">And here is the surprise.</div><div id="cap111" class="cap">Cash on delivery orders were cancelled</div><div id="cap112" class="cap">far less: <span style="color:#FFB224">8%</span> against <span style="color:#FFB224">58%</span> for</div><div id="cap113" class="cap">online payments,</div><div id="cap114" class="cap">many of which are simply abandoned</div><div id="cap115" class="cap">payments.</div><div id="cap116" class="cap">But cash on delivery orders were</div><div id="cap117" class="cap">refunded five times more often.</div><div id="cap118" class="cap"><span style="color:#FFB224">20%</span> against <span style="color:#FFB224">4%.</span></div><div id="cap119" class="cap">Exactly Rafi&#x27;s problem.</div><div id="cap120" class="cap">For this model,</div><div id="cap121" class="cap">history matters,</div><div id="cap122" class="cap">but only from the past.</div><div id="cap123" class="cap">A customer&#x27;s cancellations count only from</div><div id="cap124" class="cap">earlier days,</div><div id="cap125" class="cap">and refunds only from orders placed</div><div id="cap126" class="cap">at least <span style="color:#FFB224">30</span> days before.</div><div id="cap127" class="cap">Split by time again,</div><div id="cap128" class="cap">and the test set used once.</div><div id="cap129" class="cap">The cancellation model scored <span style="color:#FFB224">0.79</span> against</div><div id="cap130" class="cap"><span style="color:#FFB224">0.46</span> for random.</div><div id="cap131" class="cap">Refunds are harder: <span style="color:#FFB224">0.35</span> against <span style="color:#FFB224">0.17.</span></div><div id="cap132" class="cap">Then the engine.</div><div id="cap133" class="cap">It turns the risks into one</div><div id="cap134" class="cap">number per order,</div><div id="cap135" class="cap">the expected loss,</div><div id="cap136" class="cap">and ranks the whole day.</div><div id="cap137" class="cap">Reviewing just the top <span style="color:#FFB224">10%</span> of</div><div id="cap138" class="cap">order items catches <span style="color:#FFB224">51%</span> of the</div><div id="cap139" class="cap">loss.</div><div id="cap140" class="cap">Now let&#x27;s go back to Nadia</div><div id="cap141" class="cap">and Rafi,</div><div id="cap142" class="cap">and let CommerceGuard read the same</div><div id="cap143" class="cap">chat.</div><div id="cap144" class="cap">Her first message: <span style="color:#FFB224">20%.</span></div><div id="cap145" class="cap">days,</div><div id="cap146" class="cap"><span style="color:#FFB224">3D</span> still waiting: <span style="color:#FFB224">90.</span></div><div id="cap147" class="cap">It looks fake: <span style="color:#FFB224">95.</span></div><div id="cap148" class="cap">I want a refund: <span style="color:#FFB224">94.</span></div><div id="cap149" class="cap">And a happy customer,</div><div id="cap150" class="cap">writing Bangla in Roman letters: <span style="color:#FFB224">0%.</span></div><div id="cap151" class="cap">The model was never trained on</div><div id="cap152" class="cap">these exact messages.</div><div id="cap153" class="cap">It learned from real reviews.</div><div id="cap154" class="cap">With this,</div><div id="cap155" class="cap">Rafi could call Nadia before shipping,</div><div id="cap156" class="cap">ask for a small advance,</div><div id="cap157" class="cap">or send a clearer photo.</div><div id="cap158" class="cap">Small steps,</div><div id="cap159" class="cap">decided by risk,</div><div id="cap160" class="cap">not by guesswork.</div><div id="cap161" class="cap">The honest limits: reviews are a</div><div id="cap162" class="cap">proxy for complaints,</div><div id="cap163" class="cap">the order data is from Pakistan,</div><div id="cap164" class="cap">not Bangladesh,</div><div id="cap165" class="cap">and the costs are examples.</div><div id="cap166" class="cap">With real data from Bangladeshi sellers,</div><div id="cap167" class="cap">this gets much stronger.</div><div id="cap168" class="cap">That is CommerceGuard,</div><div id="cap169" class="cap">version two.</div><div id="cap170" class="cap">One step at a time.</div><div id="cap171" class="cap">One model at a time.</div><div id="cap172" class="cap">Predict risk.</div><div id="cap173" class="cap">Understand behavior.</div><div id="cap174" class="cap">Reduce preventable losses.</div></div>
